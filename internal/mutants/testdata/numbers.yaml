    value: 2
    says: the workers the tests' runs get, few enough that the machine is unbothered and enough that they overlap
    kind: picked
    by: picker recorded in this file at c262418d8b9118725c39fe3b5a050e6ab834795a, where the quick options were written

  - name: test-timeout-seconds
